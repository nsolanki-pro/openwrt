# Build OpenWrt for the Tenda AC10 V5 (Siflower SF19A2890) from one of
# the review branches or a tenda-ac10v5-* tag, and optionally publish
# the images as a GitHub release of that tag.
name: Build Tenda AC10 V5

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch or tag to build (review/sdkfw, review/stockfw or a tenda-ac10v5-* tag)
        required: true
        default: review/sdkfw
      luci:
        description: Include the LuCI web interface
        type: boolean
        default: true
      release:
        description: Publish a GitHub release (ref must be a tag)
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: tenda-ac10v5-${{ inputs.ref }}

jobs:
  build:
    name: Build ${{ inputs.ref }}
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      REF: ${{ inputs.ref }}
      LUCI: ${{ inputs.luci }}
      RELEASE: ${{ inputs.release }}
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune --all --force > /dev/null || true
          df -h /

      - name: Install build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3-dev python3-setuptools rsync swig unzip zlib1g-dev file \
            wget zstd

      - name: Check out ${{ inputs.ref }}
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          # scripts/getver.sh derives the revision from the history
          fetch-depth: 0

      - name: Check the ref
        run: |
          if [ "$RELEASE" = true ] && ! git show-ref -q --verify "refs/tags/$REF"; then
            echo "::error::A release needs a tag, '$REF' is not one"
            exit 1
          fi
          echo "NAME=$(echo "$REF" | tr '/' '-')" >> "$GITHUB_ENV"
          git log -1 --format='Building %h %s'

      - name: Update and install feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Configure
        run: |
          cat > .config <<'CFG'
          CONFIG_TARGET_siflower=y
          CONFIG_TARGET_siflower_sf19a2890=y
          CONFIG_TARGET_siflower_sf19a2890_DEVICE_tenda_ac10-v5=y
          CFG
          if [ "$LUCI" = true ]; then echo CONFIG_PACKAGE_luci=y >> .config; fi
          make defconfig
          # the device profile must have pulled in the board's packages
          for p in kmod-dsa-mt7530 kmod-sfwifi sfwifi-firmware zram-swap; do
            grep -q "^CONFIG_PACKAGE_$p=y" .config || { echo "::error::$p missing"; exit 1; }
          done

      - name: Download sources
        run: make -j$(nproc) download

      - name: Build
        run: make -j$(nproc) || make -j1 V=s

      - name: Collect images
        run: |
          B=bin/targets/siflower/sf19a2890
          mkdir out
          cp $B/*tenda_ac10-v5* out/
          (cd out && sha256sum * > sha256sums)
          cp .config out/config.buildinfo
          ls -l out
          cat out/sha256sums

      - name: Upload images
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-${{ env.NAME }}
          path: out/

      - name: Publish release
        if: inputs.release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          case "$REF" in
          *stockfw*) fw="LMAC firmware from the Tenda AC10 V5's original firmware (review/stockfw)" ;;
          *sdkfw*)   fw="LMAC firmware from Siflower's MIT-licensed SDK (review/sdkfw)" ;;
          *)         fw="see Readme.TendaAC10V5" ;;
          esac
          {
            echo "OpenWrt for the Tenda AC10 V5 (Siflower SF19A2890), Linux 6.18."
            echo
            echo "- Tag: \`$REF\`, commit \`$(git rev-parse --short HEAD)\`"
            echo "- WiFi: $fw"
            echo "- LuCI: $LUCI"
            echo
            echo "First install: \`*-squashfs-factory.bin\` from the U-Boot console;"
            echo "upgrades: \`*-squashfs-sysupgrade.bin\` with sysupgrade."
            echo "See Readme.TendaAC10V5 in the tagged tree for details and benchmarks."
            echo
            echo '```'
            cat out/sha256sums
            echo '```'
          } > notes.md
          gh release create "$REF" out/* --verify-tag --prerelease \
            --title "Tenda AC10 V5 $REF" --notes-file notes.md

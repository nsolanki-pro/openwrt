# Defaults are auto-sized from the 52MB of RAM left after the WiFi
# firmware carve-outs (tcp_rmem/wmem max ~388KB), which window-limits a
# single TCP flow well below what HB can carry (155 vs ~240Mbit/s RX).
# Per-socket maxima only: 1MB leaves the auto-sized global tcp_mem alone
# (2MB windows hit TCP memory pressure with 4 parallel flows).
net.core.rmem_max = 1048576
net.core.wmem_max = 1048576
net.ipv4.tcp_rmem = 4096 131072 1048576
net.ipv4.tcp_wmem = 4096 16384 1048576

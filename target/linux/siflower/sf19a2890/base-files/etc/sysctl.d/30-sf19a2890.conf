# SF19A2890 (Tenda AC10 V5): 64MB board with ~52MB usable after the WiFi
# DSP carve-outs. Applied after /etc/init.d/sysctl's generic defaults.

# Generic OpenWrt picks 8192 for the 64MB class, which raises the zone
# high watermark to ~12MB and leaves ~10MB available with WiFi up; the
# stock Tenda firmware runs 1024. Keep some headroom over stock for the
# atomic RX refills (stmmac page_pool, WiFi RX buffers).
vm.min_free_kbytes = 2048

# Watermark boosting raises the reclaim floor by up to 15% of RAM after
# fragmentation events: during a 5GHz client upload it lifted "min" to
# 10MB and the OOM killer took hostapd with 5MB still free.
vm.watermark_boost_factor = 0

# Bound the packets queued per unresolved neighbour (default ~212KB each);
# the stock firmware uses this to survive ARP storms from LAN IP churn.
net.ipv4.neigh.default.unres_qlen_bytes = 10000

# The GMAC HNAT engine has no per-flow hit counters, so offloaded TCP
# flows never refresh their flowtable timeout and get torn down and
# re-offloaded every 30s, each time with a dip through the CPU path.
# UDP keeps the default so short-lived flows (DNS) don't hold HNAT slots.
net.netfilter.nf_flowtable_tcp_timeout = 300

# A soft lockup leaves the box up but unresponsive (the hardware
# watchdog is still fed from the other CPUs): panic, and with
# kernel.panic=3 reboot, instead.
kernel.softlockup_panic = 1
